---
layout: default
---

<section class="hero">
  <div class="overlay"></div>
  <div class="hero-content">
    <h1>BeaugTech</h1>
    <p>Your End User Computing (EUC) and modern workplace technologies expert</p>
  </div>
</section>

<style>
  body { margin: 0; }
  .intro-header { display: none; }
  main { padding: 0 !important; }

  .hero {
    position: relative;
    width: 100%;
    height: 600px; /* fixed height instead of vh */
    background: url('/assets/img/header.jpg') center center no-repeat;
    background-size: cover;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
  }

  .hero-content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: white;
    width: 90%;
  }

  /* Mobile adjustment */
  @media (max-width: 768px) {
    .hero {
      height: 420px;
      background-position: center top; /* keep image focus better */
    }
    .hero-content h1 {
      font-size: 2rem;
    }
  }
</style>
