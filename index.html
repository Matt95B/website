---
layout: default
---

<!-- Header section-->
<section 
  style="
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: url('/assets/img/header.jpg') center center / contain no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  "
>

  <!-- Overlay -->
  <div
    style="
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
    "
  ></div>

  <!-- Content -->
  <div
    style="
      position: relative;
      color: #ffffff;
      text-align: center;
      max-width: 900px;
      padding: 40px 20px;
    "
  >
    <h1
      style="
        font-size: clamp(2rem, 6vw, 3.5rem);
        font-weight: 700;
        margin-bottom: 20px;
      "
    >
      BeaugTech
    </h1>

    <p
      style="
        font-size: clamp(1rem, 3.5vw, 1.4rem);
        font-weight: 300;
        opacity: 0.9;
      "
    >
      Your End User Computing (EUC) and modern workplace technologies expert
    </p>

  </div>
</section>
